<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Job Application (ApplyPilot Copilot test page)</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
  fieldset { margin-bottom: 20px; }
  label { display: block; margin-top: 10px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>
<body>
<h1>Acme Corp — Software Engineer Application</h1>

<form id="application-form">

  <!-- Pattern 1: <label for=id> -->
  <label for="full_name">Full Name</label>
  <input type="text" id="full_name" name="full_name" autocomplete="name">

  <!-- Pattern 2: wrapping <label> -->
  <label>
    Email Address
    <input type="email" name="email" autocomplete="email">
  </label>

  <!-- Pattern 3: aria-label -->
  <input type="tel" name="phone" aria-label="Phone Number" autocomplete="tel">

  <!-- Pattern 4: placeholder-only, no label at all -->
  <input type="text" name="linkedin" placeholder="LinkedIn profile URL">

  <!-- Pattern 5: aria-labelledby referencing separate text -->
  <span id="portfolio-label">Portfolio URL</span>
  <input type="text" name="portfolio" aria-labelledby="portfolio-label">

  <!-- Pattern 6: nearby preceding text node, no label/aria at all -->
  <p>How did you hear about us?</p>
  <input type="text" name="referral">

  <!-- React-style controlled input: setting .value directly does NOT stick unless the
       native setter + input event is used (see the script at the bottom of this file). -->
  <label for="react_input">Desired Salary (controlled input demo)</label>
  <input type="text" id="react_input" name="react_input">

  <!-- select -->
  <label for="experience_level">Experience Level</label>
  <select id="experience_level" name="experience_level">
    <option value="">-- Select --</option>
    <option value="junior">Junior (0-2 years)</option>
    <option value="mid">Mid-level (3-5 years)</option>
    <option value="senior">Senior (6+ years)</option>
  </select>

  <!-- radio group -->
  <fieldset>
    <legend>Are you legally authorized to work in the US?</legend>
    <label><input type="radio" name="work_auth" value="yes"> Yes</label>
    <label><input type="radio" name="work_auth" value="no"> No</label>
  </fieldset>

  <!-- textarea -->
  <label for="cover_note">Anything else you'd like us to know?</label>
  <textarea id="cover_note" name="cover_note"></textarea>

  <!-- should be excluded: hidden input -->
  <input type="hidden" name="hidden_token" value="abc123">

  <!-- should be excluded: aria-hidden wrapper -->
  <div aria-hidden="true">
    <label for="aria_hidden_field">Decoy field (aria-hidden)</label>
    <input type="text" id="aria_hidden_field" name="aria_hidden_field">
  </div>

  <!-- should be excluded: display:none -->
  <div style="display:none">
    <label for="display_none_field">Decoy field (display none)</label>
    <input type="text" id="display_none_field" name="display_none_field">
  </div>

  <!-- react-auto-generated-looking id, to test the "not a good id" heuristic -->
  <label for=":r3:">Auto-generated id field</label>
  <input type="text" id=":r3:" name="weird_id_field">

  <!-- ===================================================================
       Repeating "Work Experience" blocks — Workday "My Experience" step shape.
       Exercises scanner.js section/section_index resolution via three different paths.
       =================================================================== -->

  <!-- Block 1: section resolved via nearest ancestor <fieldset>'s <legend> -->
  <fieldset>
    <legend>Work Experience 1</legend>

    <label for="we1_title">Job Title</label>
    <input type="text" id="we1_title" name="workExperience-1--jobTitle">

    <label for="we1_company">Company</label>
    <input type="text" id="we1_company" name="workExperience-1--company">

    <label for="we1_location">Location</label>
    <input type="text" id="we1_location" name="workExperience-1--location">

    <label><input type="checkbox" name="workExperience-1--currentlyWorkHere"> I currently work here</label>

    <label for="we1_from">From</label>
    <input type="text" id="we1_from" name="workExperience-1--startDate" placeholder="MM/YYYY">

    <label for="we1_to">To</label>
    <input type="text" id="we1_to" name="workExperience-1--endDate" placeholder="MM/YYYY">

    <label for="we1_desc">Role Description</label>
    <textarea id="we1_desc" name="workExperience-1--roleDescription"></textarea>
  </fieldset>

  <!-- Block 2: no <fieldset>/<legend> — section resolved via a preceding class*="heading" block -->
  <div class="section-heading">Work Experience 2</div>
  <div class="workday-block">
    <label for="we2_title">Job Title</label>
    <input type="text" id="we2_title" name="workExperience-2--jobTitle">

    <label for="we2_company">Company</label>
    <input type="text" id="we2_company" name="workExperience-2--company">

    <label for="we2_location">Location</label>
    <input type="text" id="we2_location" name="workExperience-2--location">

    <label><input type="checkbox" name="workExperience-2--currentlyWorkHere"> I currently work here</label>

    <label for="we2_from">From</label>
    <input type="text" id="we2_from" name="workExperience-2--startDate" placeholder="MM/YYYY">

    <label for="we2_to">To</label>
    <input type="text" id="we2_to" name="workExperience-2--endDate" placeholder="MM/YYYY">

    <label for="we2_desc">Role Description</label>
    <textarea id="we2_desc" name="workExperience-2--roleDescription"></textarea>

    <button type="button">+ Add Another</button>
  </div>

  <!-- Block 3: heading present but carries NO number at all — section_index must be resolved
       ONLY from the field names (workExperience-3--...), never from the heading text. -->
  <div class="section-heading">Additional Work Experience</div>
  <div class="workday-block">
    <label for="we3_title">Job Title</label>
    <input type="text" id="we3_title" name="workExperience-3--jobTitle">

    <label for="we3_company">Company</label>
    <input type="text" id="we3_company" name="workExperience-3--company">

    <label><input type="checkbox" name="workExperience-3--currentlyWorkHere"> I currently work here</label>
  </div>

  <!-- Negative case: a heading with an unrelated digit ("2 max") next to a phone field must
       NOT be mistaken for a section index — no section-ish keyword sits next to the "2". -->
  <div class="section-heading">Phone Numbers (2 max)</div>
  <label for="alt_phone">Alternate Phone</label>
  <input type="tel" id="alt_phone" name="altPhone" placeholder="555-0199">

  <button type="submit">Submit Application</button>
</form>

<script>
  // Simulates a React-controlled input: a re-render loop enforces the value in `reactState`
  // unless the native `input` event fired (which is what setNativeValue() in scanner.js
  // triggers). Setting el.value = x directly with no event will get silently reverted.
  (function () {
    var el = document.getElementById('react_input');
    var reactState = '';
    el.addEventListener('input', function (e) { reactState = e.target.value; });
    setInterval(function () {
      if (el.value !== reactState) el.value = reactState;
    }, 50);
  })();
</script>
</body>
</html>
