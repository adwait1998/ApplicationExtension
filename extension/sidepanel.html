<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ApplyPilot Copilot</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="title">
      <span class="dot" id="serviceDot" title="Service status unknown"></span>
      ApplyPilot Copilot
    </div>
    <button id="optionsBtn" class="icon-btn" title="Settings">Settings</button>
  </header>

  <div class="reminder">
    You review and submit. This extension never clicks submit and never navigates — it only
    fills fields and highlights what it did. This panel stays open across tab switches; nothing
    runs on a page until you click Fill or Report on that tab.
  </div>

  <div id="staleBanner" class="stale-banner" hidden></div>

  <div id="statusBox" class="status"></div>

  <div id="progressBox" class="progress-box" hidden>
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="actions">
    <button id="scanBtn" class="primary">Fill this page</button>
    <button id="cancelBtn" class="secondary cancel" hidden>Cancel</button>
  </div>
  <div class="actions">
    <button id="undoBtn" class="secondary" disabled>Undo</button>
    <button id="reportBtn" class="secondary" title="Save this page's form structure (no values) to diagnose a bad fill">Report page</button>
  </div>
  <div class="actions">
    <button id="coverLetterBtn" class="secondary" title="Draft a cover letter for this job from your profile and résumé">Draft cover letter</button>
  </div>

  <div id="coverLetterStatus" class="cover-letter-status" hidden></div>
  <div id="coverLetterBox" class="cover-letter-box" hidden>
    <div class="draft-badge">DRAFT — review before using</div>
    <div id="coverLetterJob" class="cover-letter-job"></div>
    <textarea id="coverLetterText" class="cover-letter-text" readonly rows="10"></textarea>
    <div id="coverLetterWarnings" class="cover-letter-warnings" hidden></div>
    <div class="actions">
      <button id="coverLetterCopyBtn" class="secondary">Copy</button>
      <button id="coverLetterDownloadBtn" class="secondary">Download .txt</button>
      <button id="coverLetterInsertBtn" class="secondary" hidden>Insert into the cover-letter box</button>
    </div>
  </div>

  <div id="fillSummary" class="fill-summary" hidden></div>
  <div id="resumeLine" class="resume-line" hidden></div>

  <div id="results" class="results"></div>

  <div id="rememberBox" class="remember-box" hidden>
    <div class="actions">
      <button id="rememberBtn" class="secondary" title="Save the answers you typed into the fields this fill left for you, so the answer-bank tier can fill them next time">Remember my answers</button>
    </div>
    <div id="rememberStatus" class="remember-status" hidden></div>
    <div id="rememberDetails" class="remember-details"></div>
  </div>

  <footer>
    <span id="tiersLine"></span>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
