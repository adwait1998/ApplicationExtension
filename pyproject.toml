[project]
name = "applypilot"
version = "0.3.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "mcp>=1.9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
# .docx résumé import (extension/resume_import.py) -- lazily imported and
# optional at runtime; .pdf/.txt import works without it.
resume = ["python-docx>=1.0"]

[project.scripts]
applypilot = "applypilot.__main__:main"

[project.urls]
Homepage = "https://github.com/Pickle-Pixel/ApplyPilot"
Repository = "https://github.com/Pickle-Pixel/ApplyPilot"
Issues = "https://github.com/Pickle-Pixel/ApplyPilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build]
artifacts = ["src/applypilot/config/*.yaml", "src/applypilot/webui/static/*.html", "src/applypilot/data/*.jsonl"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
# Every test lives in tests/. Without this, a bare `pytest` also collects the
# standalone verification harnesses in scripts/ (chrome_load_test.py matches
# the *_test.py pattern), whose top-level code launches Chrome and calls
# sys.exit() — collection aborts and ZERO tests run.
testpaths = ["tests"]
